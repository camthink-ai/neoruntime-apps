# NeoRuntime Platform Application Manifest
# GymOps Pose Coach - Real-time gym pose analysis, counting, zone occupancy, safety alerts

apiVersion: v1
kind: Application

metadata:
  id: gym-ops
  name: GymOps Pose Coach
  version: 0.1.2
  description: Real-time gym pose coaching with squat/pushup counting, zone occupancy, and safety alerts
  author: NeoRuntime Team

spec:
  image: neoruntime/gym-ops:0.1.2

  # App-owned models, each an AMPK .bin package COPY'd into the image at
  # /opt/aipc/models/ (generated from the vendored .hef artifacts by
  # scripts/make_ampk_package.py — embedded HEF bytes are identical).
  # At install app-manager extracts the package from the IMAGE (the
  # runtime bind-mount shadowing of /opt/aipc/models does not matter),
  # unpacks the HEF host-side under app-models/<app>/<alias>/ and preloads
  # the registration (Transient, OwnerId=gym-ops, re-registered at every
  # reboot). The pose package pins postprocess_profile=yolov8_pose so the
  # preloaded variant already carries the create-time native_yolov8_pose
  # decoder flag; the app's startup registration keeps a correct incumbent
  # (see app.py _register_model / registration.py).
  # Requires a platform app-manager with bundled-package support
  # (platform/app-manager/server/bundled_package.go, ≥ 2026-09-28).
  models:
    pose:
      id: yolov8s_pose
      path: /opt/aipc/models/yolov8s_pose.bin
      required: true
    detect:
      id: yolov8n
      path: /opt/aipc/models/hailo_yolov8n_384_640.bin
      required: true

  resources:
    cpu: "300%"
    memory: "1Gi"

  # Read-only access to the host model store. Only used by the
  # self-registration fallback on platforms without bundled-package
  # preload (see config.py _resolve_model_path); the primary model source
  # is the spec.models AMPK bundle above.
  volumes:
    - host: /data/aipc/models
      container: /data/aipc/models
      readonly: true
    - host: /data/aipc/models
      container: /opt/aipc/models
      readonly: true
    # Persistent config: face DB, audio prompts, config.yaml
    - host: /data/aipc/etc/gym-ops
      container: /data/aipc/etc/gym-ops

  permissions:
    video:
      - main.raw
      - sub.raw
      - third.raw

    inference:
      # Preload walks this list at app start; every id must resolve to a
      # platform model row or a spec.models bundle (both do here). The
      # bundled packages pin the postprocess profiles, so preloads are
      # already correctly configured and the app keeps them.
      models:
        - yolov8s_pose
        - yolov8n
      max_qps: 30
      max_concurrent: 2
      allow_register_model: true

    events:
      publish:
        - gym/occupancy
        - gym/equipment
        - gym/pose
        - gym/alerts
        - gym/health
        - gym/identity
        - gym/trajectory

    # host network so the browser can reach the web console + platform-api
    # H.264 MSE endpoint on the device's LAN IP (mirrors model-showcase).
    network:
      mode: host
      inbound:
        - 8890

  env:
    - name: WEB_PORT
      value: "8890"
    - name: STREAM_ID
      value: "sub"
    - name: INFER_STREAM_ID
      value: "sub"
    - name: INFER_FPS
      value: "10"
    - name: POSE_MODEL
      value: "yolov8s_pose"
    - name: POSE_CONFIDENCE_THRESHOLD
      value: "0.35"
    - name: KEYPOINT_THRESHOLD
      value: "0.25"
    - name: SCORE_THRESHOLD
      value: "0.6"
    - name: NMS_THRESHOLD
      value: "0.7"
    - name: MODEL_ROOT
      value: "/data/aipc/models"
    - name: CONFIG_PATH
      value: "/data/aipc/etc/gym-ops/config.yaml"
    - name: LOG_LEVEL
      value: "INFO"
    - name: ALERT_COOLDOWN_SECONDS
      value: "10"
    - name: EQUIPMENT_OCCUPANCY_SECONDS
      value: "5"
    - name: LONG_OCCUPATION_SECONDS
      value: "1800"
    - name: FALL_CANDIDATE_SECONDS
      value: "6"
    - name: LONG_STATIC_SECONDS
      value: "120"
    # HD 1080P preview reuses platform-api hardware H.264 stream
    # (wss://<lan-ip>:443/api/v1/h264/main) via browser-native MSE.
    - name: PLATFORM_API_WS_SCHEME
      value: "wss"
    - name: PLATFORM_API_PORT
      value: "443"
    - name: PLATFORM_API_TOKEN
      value: "${AIPC_TOKEN_KEY}"
    # Secondary detection model for parallel inference (empty string = disabled)
    - name: DETECT_MODEL
      value: "yolov8n"
    - name: ENABLE_PARALLEL_INFER
      value: "true"
    # Depth-N async inference pipeline: frames kept in-flight on the NPU.
    # 1 = serial (legacy kill-switch); 2 = default pipeline; 3 = deeper.
    - name: PIPELINE_DEPTH
      value: "2"
    # Face recognition (Phase 2) — dormant since 0.1.2: the mobilefacenet
    # pipeline was never wired (no registration/inference), so the model
    # is neither bundled nor preloaded. Empty string keeps the feature off
    # until it is actually implemented.
    - name: FACE_MODEL
      value: ""
    - name: FACE_DB_PATH
      value: "/data/aipc/etc/gym-ops/faces.json"
    - name: FACE_THRESHOLD
      value: "0.6"
    # Audio prompts (Phase 3)
    - name: AUDIO_DIR
      value: "/data/aipc/etc/gym-ops/audio"
    - name: AUDIO_COOLDOWN_SECONDS
      value: "5"
    # Gate unlock on member recognition (Phase 3)
    - name: ENABLE_GATE
      value: "false"
    - name: ENABLE_ALARM
      value: "true"
    - name: GATE_UNLOCK_SECONDS
      value: "5"
    # Trajectory: zone-visit sessions + JSONL persistence
    - name: ENABLE_TRAJECTORY
      value: "true"
    - name: TRAJECTORY_MIN_VISIT_SECONDS
      value: "3"
    - name: TRAJECTORY_REJOIN_SECONDS
      value: "30"
    - name: TRAJECTORY_SESSION_CLOSE_SECONDS
      value: "10"
    - name: TRAJECTORY_TRAIL_POINTS
      value: "60"
    - name: TRAJECTORY_PERSIST
      value: "true"
    - name: TRAJECTORY_LINK_MEMBER_IDENTITY
      value: "false"
    - name: TRAJECTORY_RETENTION_DAYS
      value: "30"
    - name: TRAJECTORY_DIR
      value: "/data/aipc/etc/gym-ops/trajectory"
    - name: TRAJECTORY_REBIND_COUNTER
      value: "true"

  autostart: false
  restart_policy: on-failure
  restart_max_retries: 3

  healthcheck:
    enabled: true
    interval: 30s
    timeout: 5s
    retries: 3
