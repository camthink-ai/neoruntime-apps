name: Build examples

on:
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - "scripts/build_app.sh"
      - "scripts/fetch_models.sh"
      - "scripts/resolve_sdk_version.sh"
      - "scripts/smoke_image.sh"
      - "sdk.lock"
      - ".github/workflows/examples-build.yml"
  # Always create the stable PR checks. The discover job decides whether a
  # build is needed; workflow-level path filtering can leave required checks
  # permanently pending.
  pull_request:
  workflow_dispatch:
    inputs:
      example:
        description: Optional single example name. Leave empty to build all examples.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
      has-changes: ${{ steps.discover.outputs.has-changes }}

    steps:
      - name: Checkout apps repository
        uses: actions/checkout@v7

      - name: Discover affected examples
        id: discover
        uses: actions/github-script@v9
        env:
          REQUESTED_EXAMPLE: ${{ inputs.example }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const available = fs.readdirSync('examples', {withFileTypes: true})
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .filter((name) =>
                fs.existsSync(path.join('examples', name, 'Dockerfile')) &&
                fs.existsSync(path.join('examples', name, 'app.yaml')),
              )
              .sort();

            const requested = (process.env.REQUESTED_EXAMPLE || '').trim();
            let selected = [];

            if (context.eventName === 'workflow_dispatch') {
              if (requested && !available.includes(requested)) {
                core.setFailed(`Unknown example: ${requested}`);
                return;
              }
              selected = requested ? [requested] : available;
            } else if (context.eventName !== 'pull_request') {
              // Main pushes validate the complete set.
              selected = available;
            } else {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                const changedPaths = files.flatMap((file) =>
                  file.previous_filename
                    ? [file.filename, file.previous_filename]
                    : [file.filename],
                );
                const sharedPaths = new Set([
                  '.github/workflows/examples-build.yml',
                  'scripts/build_app.sh',
                  'scripts/fetch_models.sh',
                  'scripts/resolve_sdk_version.sh',
                  'scripts/smoke_image.sh',
                  'sdk.lock',
                ]);
                const runAll = files.length >= 3000 ||
                  changedPaths.some((changedPath) => sharedPaths.has(changedPath));
                selected = runAll
                  ? available
                  : available.filter((name) =>
                      changedPaths.some((changedPath) =>
                        changedPath.startsWith(`examples/${name}/`),
                      ),
                    );
              } catch (error) {
                // A detector failure must increase coverage, never reduce it.
                core.warning(`Unable to classify changed files: ${error.message}`);
                selected = available;
              }
            }

            core.setOutput('examples', JSON.stringify(selected));
            core.setOutput('has-changes', selected.length > 0 ? 'true' : 'false');
            await core.summary
              .addHeading('Example build scope', 3)
              .addList(selected.length > 0 ? selected : ['No example builds required'])
              .write();

  build:
    needs: discover
    if: needs.discover.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}

    steps:
      - name: Checkout apps repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build example (arm64)
        run: |
          set -euo pipefail
          ./examples/${{ matrix.example }}/build.sh arm64

      - name: Smoke test image
        run: |
          set -euo pipefail
          ./scripts/smoke_image.sh examples/${{ matrix.example }}

  examples-ci:
    name: Examples CI
    needs:
      - discover
      - build
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Verify example jobs
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_CHANGES: ${{ needs.discover.outputs.has-changes }}
        run: |
          set -euo pipefail
          test "$DISCOVER_RESULT" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
