name: Build showcase bundles

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "showcases/**"
      - "scripts/build_showcase_artifacts.sh"
      - "scripts/fetch_models.sh"
      - "scripts/resolve_sdk_version.sh"
      - ".github/workflows/showcase-artifacts.yml"
      - "sdk.lock"
  # Keep required checks present for every PR. Individual matrix jobs become
  # inexpensive no-ops when their showcase is unaffected.
  pull_request:
  workflow_dispatch:
    inputs:
      showcase:
        description: Optional single showcase name. Leave empty to build all showcases.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: showcase-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      showcases: ${{ steps.discover.outputs.showcases }}
      selected: ${{ steps.discover.outputs.selected }}
      has-changes: ${{ steps.discover.outputs.has-changes }}

    steps:
      - name: Checkout apps repository
        uses: actions/checkout@v7

      - name: Discover affected showcases
        id: discover
        uses: actions/github-script@v9
        env:
          REQUESTED_SHOWCASE: ${{ inputs.showcase }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const available = fs.readdirSync('showcases', {withFileTypes: true})
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name)
              .filter((name) =>
                fs.existsSync(path.join('showcases', name, 'Dockerfile')) &&
                fs.existsSync(path.join('showcases', name, 'app.yaml')),
              )
              .sort();

            const requested = (process.env.REQUESTED_SHOWCASE || '').trim();
            let selected = [];

            if (context.eventName === 'workflow_dispatch') {
              if (requested && !available.includes(requested)) {
                core.setFailed(`Unknown showcase: ${requested}`);
                return;
              }
              selected = requested ? [requested] : available;
            } else if (context.eventName !== 'pull_request') {
              // Main and release-tag pushes publish a complete bundle set.
              selected = available;
            } else {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                const changedPaths = files.flatMap((file) =>
                  file.previous_filename
                    ? [file.filename, file.previous_filename]
                    : [file.filename],
                );
                const sharedPaths = new Set([
                  '.github/workflows/showcase-artifacts.yml',
                  'scripts/build_showcase_artifacts.sh',
                  'scripts/fetch_models.sh',
                  'scripts/resolve_sdk_version.sh',
                  'sdk.lock',
                ]);
                const runAll = files.length >= 3000 ||
                  changedPaths.some((changedPath) => sharedPaths.has(changedPath));
                selected = runAll
                  ? available
                  : available.filter((name) =>
                      changedPaths.some((changedPath) =>
                        changedPath.startsWith(`showcases/${name}/`),
                      ),
                    );
              } catch (error) {
                core.warning(`Unable to classify changed files: ${error.message}`);
                selected = available;
              }
            }

            // The complete matrix is intentional: current branch protection
            // requires several matrix job names. Unaffected jobs report a
            // successful no-op until protection moves to Showcases CI.
            core.setOutput('showcases', JSON.stringify(available));
            core.setOutput('selected', JSON.stringify(selected));
            core.setOutput('has-changes', selected.length > 0 ? 'true' : 'false');
            await core.summary
              .addHeading('Showcase build scope', 3)
              .addList(selected.length > 0 ? selected : ['No showcase builds required'])
              .write();

  build:
    name: build (${{ matrix.showcase }}, ${{ matrix.arch }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        showcase: ${{ fromJSON(needs.discover.outputs.showcases) }}
        arch:
          - arm64
    env:
      SHOULD_BUILD: ${{ contains(fromJSON(needs.discover.outputs.selected), matrix.showcase) && 'true' || 'false' }}

    steps:
      - name: No build required
        if: env.SHOULD_BUILD != 'true'
        run: echo "${{ matrix.showcase }} is unaffected"

      - name: Checkout apps repository
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v7
        with:
          path: apps

      # Teaching demo only: its offline suite guards the SDK-compat and
      # snippet-anchor contracts; runs before Docker build time is spent.
      - name: Set up Python
        if: env.SHOULD_BUILD == 'true' && matrix.showcase == 'sdk-teaching-demo'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Offline test suite (sdk-teaching-demo)
        if: env.SHOULD_BUILD == 'true' && matrix.showcase == 'sdk-teaching-demo'
        working-directory: apps/showcases/sdk-teaching-demo
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest numpy opencv-python-headless
          python -m pytest tests/ -q

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build showcase bundle
        if: env.SHOULD_BUILD == 'true'
        working-directory: apps
        run: |
          set -euo pipefail
          scripts/build_showcase_artifacts.sh \
            --arch "${{ matrix.arch }}" \
            --output dist/showcases \
            "${{ matrix.showcase }}"

      - name: Upload showcase bundle
        if: env.SHOULD_BUILD == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.showcase }}-${{ matrix.arch }}-bundle
          path: apps/dist/showcases/${{ matrix.showcase }}-*.neoapp
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}
          compression-level: 0

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download showcase bundles
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload-assets

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="$GITHUB_REF_NAME"
            release_notes_file="release-notes.md"
            printf 'Showcase application bundles for %s.\n' "$GITHUB_REF_NAME" > "$release_notes_file"
            create_flags=()
            edit_flags=()
            cp release-assets/*.neoapp upload-assets/
          else
            release_tag="showcase-bundles-latest"
            release_title="Latest showcase bundles"
            release_notes_file="release-notes.md"
            create_flags=(--prerelease --latest=false)
            edit_flags=(--prerelease)

            {
              printf 'Latest showcase application bundles built from main at `%s`.\n\n' "$GITHUB_SHA"
              printf '| Showcase | Download |\n'
              printf '| -------- | -------- |\n'
            } > "$release_notes_file"

            for asset in release-assets/*.neoapp; do
              bundle_name="$(basename "$asset" .neoapp)"
              arch="${bundle_name##*-}"
              without_arch="${bundle_name%-${arch}}"
              version="${without_arch##*-}"
              app="${without_arch%-${version}}"
              latest_name="${app}-latest-${arch}.neoapp"

              cp "$asset" "upload-assets/$latest_name"
              printf '| `%s` | [`%s`](https://github.com/%s/releases/download/%s/%s) |\n' \
                "$app" "$latest_name" "$GITHUB_REPOSITORY" "$release_tag" "$latest_name" >> "$release_notes_file"
            done
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$release_tag" = "showcase-bundles-latest" ]; then
              gh release view "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' \
                | while read -r asset_name; do
                    [ -n "$asset_name" ] || continue
                    gh release delete-asset "$release_tag" "$asset_name" \
                      --repo "$GITHUB_REPOSITORY" \
                      --yes
                  done
            fi

            gh release upload "$release_tag" upload-assets/*.neoapp \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$release_notes_file" \
              "${edit_flags[@]}"
          else
            gh release create "$release_tag" upload-assets/*.neoapp \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$release_notes_file" \
              "${create_flags[@]}"
          fi

  showcases-ci:
    name: Showcases CI
    needs:
      - discover
      - build
      - release
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Verify showcase jobs
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          IS_RELEASE_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -euo pipefail
          test "$DISCOVER_RESULT" = success
          test "$BUILD_RESULT" = success
          if [ "$IS_RELEASE_PUSH" = true ]; then
            test "$RELEASE_RESULT" = success
          else
            test "$RELEASE_RESULT" = skipped
          fi
